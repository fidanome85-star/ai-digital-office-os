name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ai_office
          POSTGRES_PASSWORD: ai_office_dev_password
          POSTGRES_DB: ai_digital_office_os
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ai_office -d ai_digital_office_os"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://ai_office:ai_office_dev_password@localhost:5432/ai_digital_office_os
      APP_DATABASE_URL: postgres://ai_office_app:ai_office_app_dev_password@localhost:5432/ai_digital_office_os
      AUTH_JWT_ISSUER: https://auth.ai-digital-office-os.local/
      AUTH_JWT_AUDIENCE: ai-digital-office-os-control-plane
      AUTH_JWKS_URI: https://auth.ai-digital-office-os.local/.well-known/jwks.json
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Run all migrations against a clean database
        run: pnpm db:migrate

      - name: Typecheck every workspace package
        run: pnpm typecheck

      - name: Domain-model consistency gate — generated types must match committed types
        run: |
          pnpm domain-model:generate
          git diff --exit-code -- packages/domain-model/src/generated || \
            (echo "::error::packages/domain-model/src/generated/tables.ts is stale — run 'pnpm domain-model:generate' and commit the result." && exit 1)

      - name: Unit tests (packages/auth)
        run: pnpm --filter @ai-office/auth run test

      - name: Unit tests (packages/observability)
        run: pnpm --filter @ai-office/observability run test

      - name: Unit tests (packages/policy-engine)
        run: pnpm --filter @ai-office/policy-engine run test

      - name: RLS cross-tenant adversarial test
        run: pnpm test:rls-adversarial

      - name: control-plane-api integration tests (golden path + OpenAPI coverage + tenant isolation)
        run: pnpm --filter @ai-office/control-plane-api run test

      - name: agent-factory pipeline integration tests
        run: pnpm --filter @ai-office/agent-factory run test

      - name: model-router-gateway tests (adapters against mock providers + real execution)
        run: pnpm --filter @ai-office/model-router-gateway run test

      - name: tool-gateway-mcp tests (MCP client + binding/policy enforcement)
        run: pnpm --filter @ai-office/tool-gateway-mcp run test

      - name: workflow-engine tests (durable step execution, resumability, pause)
        run: pnpm --filter @ai-office/workflow-engine run test

      - name: memory-service tests (tiered memory + real pgvector semantic search)
        run: pnpm --filter @ai-office/memory-service run test

      - name: cost-usage-service tests (real budget_status against budget_tiers)
        run: pnpm --filter @ai-office/cost-usage-service run test

      - name: deployment-orchestrator tests (health-checked advance/rollback)
        run: pnpm --filter @ai-office/deployment-orchestrator run test

      - name: policy-engine-service tests (policy CRUD + approval expiry)
        run: pnpm --filter @ai-office/policy-engine-service run test
