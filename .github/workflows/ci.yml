name: AI Digital Office OS CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-verify:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Run Test Suite
      run: |
        python -m unittest discover -s tests -p "test_*.py"

    - name: Dry Run Autonomous Pipeline
      run: |
        python main.py "CI_CD_VERIFICATION_RUN" "Verify entire agentic factory startup"
